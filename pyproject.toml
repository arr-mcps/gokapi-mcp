[project]
name = "gokapi-mcp"
version = "0.1.0"
description = "MCP server for Gokapi's REST API"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0.0", "httpx>=0.27.0"]

[project.scripts]
gokapi-mcp = "gokapi_mcp:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: hits a real Gokapi instance (needs GOKAPI_URL)"]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
